name: CI
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # Manual lever for the case the automation cannot cover: the release was
  # created but the PyPI upload failed (registry down, trusted-publishing
  # hiccup). Re-firing `release: published` for an already-published release
  # means flipping it back to draft and out again; this is the plain re-run.
  # Select the *tag*, not main - see the publish job.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install ruff
      # .github/scripts is release-critical (it writes the release notes) and
      # was previously unlinted.
      - run: uv run ruff check src/ tests/ .github/scripts/
      - run: uv run ruff format --check src/ tests/ .github/scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python }}"
      - run: uv pip install -e ".[dev,torch,sklearn,boosting,tune]"
      - run: uv run pytest tests/ -v -m "not cuda"
      # Coverage XML is uploaded so coverage trends are inspectable without a
      # third-party account. pytest already produces it via addopts.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  test-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install -e ".[dev,torch,sklearn,boosting,tune]"
      - run: |
          uv run python examples/pytorch_auto.py
          uv run python examples/pytorch_fit.py
          uv run python examples/pytorch_tune.py
          uv run python examples/pytorch_ddp.py
          uv run python examples/pytorch_optimize.py
          uv run python examples/sklearn_example.py
          uv run python examples/xgboost_example.py




  # GPU tests run on a self-hosted runner (your RTX 5070 box, registered with
  # the `self-hosted` and `gpu` labels). This is what catches the class of
  # CUDA-path bug that CPU CI cannot - the device_count() crash, the
  # _pretend_cuda stub defect, and the /nfs PermissionError were all found
  # by running on a real GPU, not by CPU CI.
  #
  # IMPORTANT: until a runner with the `self-hosted,gpu` labels is registered
  # (see RUNNER_SETUP.md), this job shows as "queued" and never runs. That is
  # intentional - it surfaces "you haven't finished setup" rather than
  # silently skipping GPU coverage. The job is NOT required (no branch
  # protection rule includes it), so it does not block merges.
  #
  # Runner setup (one-time): see RUNNER_SETUP.md.
  test-cuda:
    runs-on: [self-hosted, gpu]
    # Cap the job's *execution* time. This does NOT cover the "queued
    # forever because the runner is offline" case (the timeout only starts
    # counting once a runner picks the job up), but it turns an
    # in-execution hang (driver crash, stuck NCCL collective, deadlocked
    # distributed test) from "stuck running silently" into "failed after
    # 30min" - a visible signal instead of an invisible one.
    timeout-minutes: 30
    env:
      PYTHON: C:\Python313\python.exe
    steps:
      - uses: actions/checkout@v7
      # Create a venv in the runner's persistent work dir. The system Python
      # at C:\Python313 is uv-managed and carries the PEP 668 EXTERNALLY-
      # MANAGED marker, so installing straight into it fails with
      # 'externally-managed-environment'. A venv is the right pattern anyway
      # - isolates autotrainer + torch from the system Python. The venv is
      # outside _work so it survives across runs (the 2.5GB torch wheel
      # would re-download every run otherwise).
      #
      # All subsequent steps prepend D:\runner-venv\Scripts to PATH so plain
      # `python` and `pip` resolve there.
      - name: Create persistent venv and add to PATH
        shell: pwsh
        run: |
          if (-not (Test-Path D:\runner-venv\Scripts\python.exe)) {
            & "$env:PYTHON" -m venv D:\runner-venv
          }
          & D:\runner-venv\Scripts\python.exe -m pip install --upgrade pip
          Add-Content -Path $env:GITHUB_PATH -Value "D:\runner-venv\Scripts"
      # Install the base extras WITHOUT torch first, then the CUDA-enabled torch wheel
      # from the PyTorch index.
      - name: Install autotrainer (no torch)
        run: python -m pip install -e ".[dev,sklearn,boosting,tune]"
      - name: Install cu128 nightly torch
        run: python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cu128
      # Sanity: confirm the runner actually has a visible CUDA device before
      # running the suite.
      - name: GPU sanity check
        run: |
          python -c "import torch; assert torch.cuda.is_available() and torch.cuda.device_count() > 0, 'No CUDA GPU visible - check CUDA_VISIBLE_DEVICES and driver'; print(f'GPU OK: {torch.cuda.get_device_name(0)} (capability {torch.cuda.get_device_capability(0)})')"
      - name: Run cuda-marked tests
        run: python -m pytest tests/ -v -m "cuda" --no-cov

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install -e ".[dev,torch,sklearn,boosting,tune]"
      - run: uv run mypy src/autotrainer

  # TensorFlow is heavy and its install can break on the newest Python in the
  # matrix, so it gets its own single-version job rather than running in every
  # matrix cell. Only the TF-specific tests run here.
  test-tf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install -e ".[dev,tf]"
      - run: uv run pytest tests/ -v -k "TFConfig or tf" --no-cov

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install -e ".[dev,torch,sklearn,boosting,tune]"
      - run: uv run pdoc -o docs/build src/autotrainer
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/build/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/build/

  # Publish the pdoc API reference to GitHub Pages on every push to main.
  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true # first run enables Pages with the Actions source
      - uses: actions/deploy-pages@v5
        id: deployment

  # test-cuda runs on a self-hosted runner. When that box is offline the job
  # sits "queued" indefinitely and GPU coverage silently drops to zero while the
  # run still looks fine. `timeout-minutes` does not help: it only starts
  # counting once a runner picks the job up, so a job nobody picks up is never
  # timed out. This watchdog watches the current run and says so out loud.
  #
  # It annotates rather than failing, because test-cuda is deliberately not a
  # required check - replace the `::warning::` line with `exit 1` to make a
  # missing GPU runner hard-blocking.
  cuda-watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: read # read this run's job list
    steps:
      - name: Warn if the GPU runner never picks up test-cuda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | select(.name=="test-cuda") | .status' 2>/dev/null || true)
            case "$status" in
              "")     echo "test-cuda is not part of this run - nothing to watch"; exit 0 ;;
              queued) sleep 30 ;;
              *)      echo "test-cuda is '$status' - a GPU runner picked it up"; exit 0 ;;
            esac
          done
          echo "::warning title=GPU runner offline::test-cuda sat queued for 10 minutes; the self-hosted GPU runner did not pick it up, so nothing in this run exercised a real CUDA device. See RUNNER_SETUP.md."
          {
            echo "### :warning: No GPU coverage in this run"
            echo
            echo "\`test-cuda\` was still queued after 10 minutes, so the self-hosted"
            echo "GPU runner is most likely offline. Nothing here touched a real CUDA"
            echo "device. See [RUNNER_SETUP.md](RUNNER_SETUP.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Single source of truth for "what version is this ref, and is it a
  # prerelease". The release job computes neither, because it is skipped on the
  # manual publish paths - and being wrong there means an RC uploaded to
  # production PyPI, where versions are immutable and therefore unfixable.
  version-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$version" ]; then
            echo "could not read version from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only an exact X.Y.Z goes to production PyPI. Anything with a PEP 440
          # suffix (rc/a/b/.dev, and conservatively .post) is a prerelease. The
          # bias is deliberate: mistaking a real release for a prerelease costs
          # one re-run, the reverse burns a version number permanently.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$version is a stable release -> PyPI"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version is a prerelease -> TestPyPI"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # Cut the GitHub Release automatically when main's version changes, so
  # shipping is "merge a version bump" rather than a manual step someone has to
  # remember (0.13.0 sat released-in-name-only on main until someone noticed).
  # Every ordinary push to main reaches this job and exits at the check - the
  # tag already exists, so there is nothing to do.
  #
  # test-tf is release-blocking: tf is a supported extra, so shipping with its
  # tests red ships a known-broken install path. test-cuda deliberately is NOT
  # here - it targets the self-hosted runner, and a `needs` on a job that sits
  # queued (runner offline) does not fail, it hangs the release indefinitely.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, test-examples, typecheck, test-tf, version-info]

    # Two merges landing close together read the same version. If the second
    # run's tag check beats the first run's `gh release create`, it also
    # decides the version is new and then dies at 422. Serializing makes it
    # take the clean "already tagged" no-op instead. Scoped to the job so the
    # rest of CI still runs in parallel across pushes.
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    outputs:
      new: ${{ steps.check.outputs.new }}
    env:
      VERSION: ${{ needs.version-info.outputs.version }}
      PRERELEASE: ${{ needs.version-info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are what distinguish a new version from a shipped one
      - id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged - nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new - cutting a release"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Fails the job if there are no notes to ship, rather than publishing a
      # release with an empty body. A prerelease has no CHANGELOG section of its
      # own - an RC ships whatever is currently unreleased - so it reads
      # [Unreleased] instead, and still fails if that is empty too.
      - if: steps.check.outputs.new == 'true'
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            python .github/scripts/changelog_section.py "$VERSION" \
              --fallback-unreleased > release-notes.md
          else
            python .github/scripts/changelog_section.py "$VERSION" > release-notes.md
          fi
      - if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "v$VERSION" --prerelease \
              --target "$GITHUB_SHA" \
              --title "autotrainer $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "autotrainer $VERSION" \
              --notes-file release-notes.md
          fi

  # Three ways in: the release job cut a new version in THIS run (automatic), a
  # release was published by hand, or someone re-ran the workflow to retry an
  # upload that failed after the release already existed.
  #
  # The automatic path deliberately does NOT wait to be re-triggered by its own
  # release event. GitHub does not start workflow runs for events raised with
  # GITHUB_TOKEN - a guard against workflows triggering themselves - so a
  # release created above fires nothing. Publishing therefore has to happen in
  # the same run, via needs+outputs. Wiring it the obvious way instead would
  # create releases that silently never reach PyPI.
  #
  # The workflow_dispatch path is restricted to tag refs. Dispatching from main
  # would build whatever main happens to be now and upload it under the version
  # in pyproject.toml - i.e. quietly ship post-release commits as the released
  # version. Requiring a tag makes the retry reproduce the release it retries.
  #
  # always() is needed because `release` is skipped on both manual paths and a
  # skipped dependency would skip this job too; the explicit result checks put
  # back the gating that always() switches off.
  #
  # Stable versions go to PyPI, prereleases to TestPyPI. Both ternaries below
  # test for `== 'false'` rather than `== 'true'` so that ONLY an explicit
  # "this is stable" reaches production - an empty or unexpected value routes
  # to TestPyPI, which is recoverable, instead of burning a PyPI version, which
  # is not. Trusted publishing is pinned to (workflow filename, environment
  # name), so both `pypi` and `testpypi` environments need a publisher
  # configured on their respective index for ci.yml.
  publish:
    needs: [lint, test, test-examples, typecheck, test-tf, version-info, release]
    if: >-
      always()
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && needs['test-examples'].result == 'success'
      && needs.typecheck.result == 'success'
      && needs['test-tf'].result == 'success'
      && needs['version-info'].result == 'success'

      && (
        (needs.release.result == 'success' && needs.release.outputs.new == 'true')
        || (
          needs.release.result == 'skipped'
          && (
            github.event_name == 'release'
            || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
          )
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.version-info.outputs.prerelease == 'false' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # trusted publishing, no API token needed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv pip install build && uv run python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ needs.version-info.outputs.prerelease == 'false' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
